name: Deploy NASSR HUB to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate valid app icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg, os
          os.makedirs("icons", exist_ok=True)
          cairosvg.svg2png(url="icon-premium.svg", write_to="icons/icon-192.png", output_width=192, output_height=192)
          cairosvg.svg2png(url="icon-premium.svg", write_to="icons/icon-512.png", output_width=512, output_height=512)
          cairosvg.svg2png(url="icon-premium.svg", write_to="icons/icon-maskable-512.png", output_width=512, output_height=512)
          PY
          file icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
