name: Deploy NASSR HUB to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate fresh valid PWA icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg, os
          os.makedirs("icons", exist_ok=True)
          src="icon-premium.svg"
          cairosvg.svg2png(url=src, write_to="icons/nassr-hub-192.png", output_width=192, output_height=192)
          cairosvg.svg2png(url=src, write_to="icons/nassr-hub-512.png", output_width=512, output_height=512)
          cairosvg.svg2png(url=src, write_to="icons/nassr-hub-maskable-512.png", output_width=512, output_height=512)
          cairosvg.svg2png(url=src, write_to="icons/apple-touch-icon.png", output_width=180, output_height=180)
          PY
          file icons/nassr-hub-192.png icons/nassr-hub-512.png icons/nassr-hub-maskable-512.png icons/apple-touch-icon.png

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
